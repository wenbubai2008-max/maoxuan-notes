<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="《水浒传》金圣叹评七十回本，简体原文及金圣叹原批直接随文显示。">
<title>水浒传 · 金圣叹评七十回本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shuihu-jin.css?v=3">
</head>
<body>
<header class="jin-bar"><div class="jin-bar-inner">
<a class="jin-back" href="shuihu-70.html#chapters">← 返回目录</a>
<a class="jin-toplink" href="index.html">书架</a>
</div></header>
<main class="jin-read-wrap">
  <header class="jin-read-heading">
    <small id="chapter-number">金圣叹评七十回本</small>
    <h1 id="chapter-title"></h1>
    <div class="jin-legend">正文为黑色；<b>金圣叹批语为赭金色</b>，在原文位置直接显示。</div>
  </header>
  <div class="jin-controls">
    <span id="source-status" role="status">正在读取简体原文……</span>
    <div class="jin-ctrl-buttons">
      <button id="font-smaller" type="button" aria-label="减小字号">A−</button>
      <button id="font-larger" type="button" aria-label="增大字号">A＋</button>
    </div>
  </div>
  <article class="jin-page jin-body" id="chapter-content" aria-label="简体原文与金圣叹随文点评">
    <p class="jin-text">正在载入本回……</p>
  </article>
  <nav class="jin-read-nav" aria-label="切换章节">
    <a id="prev-chapter" href="shuihu-70.html#chapters">← 目录</a>
    <a id="next-chapter" href="shuihu-read.html?chapter=1">第一回 →</a>
  </nav>
  <p class="jin-credit">金圣叹七十回评本，依据维基文库文本转换为简体。金批保留原文，未加入其他版本的评语。自动转换仍可能有个别文字或分段问题，引用时请核对底本：<a id="source-link" href="https://zh.wikisource.org/wiki/水滸傳_(70回本)" target="_blank" rel="noopener noreferrer">查看底本</a>。</p>
</main>
<script src="assets/shuihu-text-clean.js?v=1"></script>
<script src="assets/shuihu-data.js"></script>
<script>
(function(){
 "use strict";
 const chapters=window.SHUIHU_CHAPTERS||[];
 const $=id=>document.getElementById(id);
 let n=Number(new URLSearchParams(location.search).get("chapter"));
 if(!Number.isInteger(n)||n<0||n>=chapters.length)n=0;
 const chapter=chapters[n];
 $("chapter-number").textContent="金圣叹评七十回本 · "+chapter.label;
 $("chapter-title").textContent=chapter.title;
 document.title=chapter.label+" · 水浒传 · 金圣叹评";
 $("prev-chapter").href=n>0?"shuihu-read.html?chapter="+(n-1):"shuihu-70.html#chapters";
 $("prev-chapter").textContent=n>0?"← "+chapters[n-1].label:"← 返回目录";
 $("next-chapter").href=n<70?"shuihu-read.html?chapter="+(n+1):"shuihu-70.html#chapters";
 $("next-chapter").textContent=n<70?chapters[n+1].label+" →":"返回目录 →";
 const link="https://zh.wikisource.org/zh-hans/"+("水滸傳_(70回本)/"+chapter.wiki).split("/").map(encodeURIComponent).join("/");
 $("source-link").href=link;
 let font=18;
 try{const previous=Number(localStorage.getItem("jin-reader-font"));if(previous>=15&&previous<=24)font=previous}catch(_){}
 function applyFont(){document.documentElement.style.setProperty("--reading-size",font+"px")}
 function save(){applyFont();try{localStorage.setItem("jin-reader-font",String(font))}catch(_){}}
 $("font-smaller").addEventListener("click",()=>{font=Math.max(15,font-1);save()});
 $("font-larger").addEventListener("click",()=>{font=Math.min(24,font+1);save()});
 applyFont();
 function el(tag,cls,text){
   const node=document.createElement(tag);
   if(cls)node.className=cls;
   if(text!==undefined)node.textContent=text;
   return node;
 }
 function render(data){
   if(!Array.isArray(data.paragraphs)||!data.paragraphs.length)throw new Error("原文数据为空");
   const notes=Array.isArray(data.jin_notes)?data.jin_notes:[];
   const notesById=new Map(notes.map((note,i)=>[Number(note.id===undefined?i:note.id),note]));
   const paragraphs=window.SHUIHU_TEXT_CLEAN?.cleanParagraphs(data.paragraphs)||data.paragraphs;
   const target=$("chapter-content"),frag=document.createDocumentFragment();
   let noteCount=0;
   function noteElement(note){
     noteCount++;
     const kind=String(note.kind||"金批");
     const content=String(note.text||"").trim();
     const isBlock=kind==="总批"||kind==="眉批"||content.length>82||content.includes("\n");
     if(isBlock){
       const box=el("aside","jin-comment-block");
       const heading=el("strong","jin-kind","【"+(kind==="金批"?"金批":kind)+"】");
       box.append(heading,document.createTextNode(content));
       return {element:box,block:true};
     }
     const inline=el("span","jin-comment-inline",content);
     inline.setAttribute("aria-label","金圣叹"+kind+"："+content);
     return {element:inline,block:false};
   }
   for(const raw of paragraphs){
     if(typeof raw!=="string"||!raw.trim())continue;
     let p=el("p","jin-text");
     const parts=raw.split(/(⟦J\d+⟧)/g);
     for(const part of parts){
       const marker=part.match(/^⟦J(\d+)⟧$/);
       if(!marker){if(part)p.appendChild(document.createTextNode(part));continue}
       const note=notesById.get(Number(marker[1]));
       if(!note){p.appendChild(document.createTextNode(part));continue}
       const item=noteElement(note);
       if(item.block){
         if(p.textContent.trim()){frag.appendChild(p);p=el("p","jin-text")}
         frag.appendChild(item.element);
       }else{
         p.appendChild(item.element);
       }
     }
     if(p.textContent.trim())frag.appendChild(p);
   }
   if(!frag.childNodes.length)throw new Error("正文内容为空");
   target.replaceChildren(frag);
   $("source-status").textContent=chapter.label+" · 金圣叹批语 "+noteCount+" 条";
   $("source-link").href=data.source||link;
 }
 async function load(){
   try{
     const response=await fetch("shuihu/text/"+String(n).padStart(3,"0")+".json");
     if(!response.ok)throw new Error("原文数据未找到（HTTP "+response.status+"）");
     render(await response.json());
   }catch(err){
     $("chapter-content").replaceChildren();
     const box=el("div","jin-source-error");
     box.append(el("h2","","本回原文暂时无法载入"),el("p","",String(err.message||err)));
     const a=el("a","","前往底本查看本回");a.href=link;a.target="_blank";a.rel="noopener noreferrer";box.appendChild(a);
     $("chapter-content").appendChild(box);
     $("source-status").textContent="原文载入失败";
   }
 }
 load();
})();
</script>
</body></html>
