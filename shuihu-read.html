<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="《水浒传》金圣叹评七十回本在线对照阅读：正文与评语区分显示。">
<title>《水浒传》阅读 · 读书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shuihu.css">
</head>
<body class="shuihu-body">
<header class="sh-top"><div class="sh-wrap">
 <a class="sh-crumb" href="shuihu.html">书架 <span aria-hidden="true">/</span> <b>水浒传</b></a>
 <nav aria-label="阅读导航"><a href="shuihu.html#chapters">章节目录</a><a href="shuihu.html#editions">版本介绍</a><a href="index.html">返回书架</a></nav>
</div></header>
<main class="sh-reader-main">
 <div class="sh-reader-head">
   <a class="back" href="shuihu.html#chapters">← 返回七十回目录</a>
   <p id="chapter-number" class="sh-eyebrow">金圣叹评七十回本</p>
   <h1 id="chapter-title">正在载入章节……</h1>
   <p>原文与金圣叹批语分开呈现；金批不是本站的结论。</p>
 </div>
 <div class="sh-reader-toolbar" role="group" aria-label="阅读设置">
   <button type="button" id="font-smaller" title="减小正文字号">字小 −</button>
   <button type="button" id="font-larger" title="增大正文字号">字大 ＋</button>
   <button type="button" id="comment-toggle" aria-pressed="true">显示金批</button>
   <a id="external-source" href="https://zh.wikisource.org/wiki/水滸傳_(70回本)" target="_blank" rel="noopener noreferrer">核对原文 ↗</a>
 </div>
 <div class="sh-read-layout">
   <article id="sh-text" class="sh-prose" aria-label="小说正文" aria-busy="true">
     <p class="sh-loading">正在读取维基文库的公开原文……</p>
   </article>
   <aside class="sh-aside" id="sh-notes" aria-label="金圣叹原批">
     <h2>金圣叹批语</h2>
     <p class="help">阅读时先看正文，再看旁边的评语。点击正文中的「批」字可定位相应批注；批语来自古籍文本，不是本站撰写。</p>
     <div id="sh-note-list"><p class="help">批语随章节加载。</p></div>
   </aside>
 </div>
 <nav class="sh-read-nav" aria-label="上一回下一回">
   <a id="prev-chapter" href="shuihu.html#chapters">← 返回目录</a>
   <a id="next-chapter" href="shuihu-read.html?chapter=1">下一回 →</a>
 </nav>
 <p class="sh-small" style="margin-top:22px">文本源自维基文库金圣叹评七十回本，章节在打开时实时读取。若原站暂时无法访问，可点“核对原文”直接打开原始来源。本站只改变显示方式，不擅自改动原批评语。</p>
</main>
<script src="assets/shuihu-data.js"></script>
<script>
(function(){
 'use strict';
 const chapters=window.SHUIHU_CHAPTERS||[];
 const params=new URLSearchParams(location.search);
 let num=Number(params.get('chapter'));
 if(!Number.isInteger(num)||num<0||num>=chapters.length)num=0;
 const ch=chapters[num];
 const $=id=>document.getElementById(id);
 $('chapter-number').textContent='金圣叹评七十回本 · '+ch.label;
 $('chapter-title').textContent=ch.title;
 document.title=ch.label+' · 水浒传 · 读书';
 $('prev-chapter').href=num>0?'shuihu-read.html?chapter='+(num-1):'shuihu.html#chapters';
 $('prev-chapter').textContent=num>0?'← '+chapters[num-1].label:'← 返回目录';
 $('next-chapter').href=num<70?'shuihu-read.html?chapter='+(num+1):'shuihu.html#chapters';
 $('next-chapter').textContent=num<70?chapters[num+1].label+' →':'返回目录 →';
 const pageTitle='水滸傳_(70回本)/'+ch.wiki;
 const source='https://zh.wikisource.org/wiki/'+encodeURIComponent(pageTitle);
 $('external-source').href=source;
 let annotations=[];
 let showComments=true;
 let fontsize=18;
 try{fontsize=Math.min(24,Math.max(15,Number(localStorage.getItem('shuihu-font-size'))||18))}catch(_){}
 $('sh-text').style.setProperty('--reading-font',fontsize+'px');
 function addComment(text,paragraph,container){
   const index=annotations.length+1;
   annotations.push({index,text,paragraph});
   const b=document.createElement('button');
   b.type='button';b.className='sh-note-mark';b.textContent='批'+index;
   b.setAttribute('aria-label','查看第'+index+'条金圣叹批语');
   b.dataset.note=String(index);
   if(!showComments)b.hidden=true;
   b.addEventListener('click',function(){
     const target=$('sh-note-'+index);
     if(!target)return;
     if(!showComments)setComments(true);
     target.scrollIntoView({behavior:'smooth',block:'nearest'});
     document.querySelectorAll('.sh-note.active').forEach(x=>x.classList.remove('active'));
     target.classList.add('active');
   });
   container.appendChild(b);
 }
 function makeParagraph(raw,index){
   const p=document.createElement('p');
   let last=0;
   const rg=/〖([\s\S]*?)〗/g;
   for(const match of raw.matchAll(rg)){
     if(match.index>last)p.appendChild(document.createTextNode(raw.slice(last,match.index)));
     addComment(match[1],index,p);
     last=match.index+match[0].length;
   }
   if(last<raw.length)p.appendChild(document.createTextNode(raw.slice(last)));
   return p;
 }
 function renderNotes(){
   const list=$('sh-note-list');list.replaceChildren();
   if(!annotations.length){
     const p=document.createElement('p');p.className='help';p.textContent='此页尚未识别出以〖〗标记的评语，请以原站文字为准。';list.appendChild(p);return;
   }
   const frag=document.createDocumentFragment();
   annotations.forEach(a=>{
     const div=document.createElement('section');div.className='sh-note';div.id='sh-note-'+a.index;
     const heading=document.createElement('b');heading.textContent='金批 '+a.index;
     const content=document.createElement('p');content.textContent=a.text;
     div.append(heading,content);frag.appendChild(div);
   });
   list.appendChild(frag);
 }
 function setComments(on){
   showComments=on;
   $('comment-toggle').setAttribute('aria-pressed',String(on));
   $('comment-toggle').textContent=on?'显示金批':'只读正文';
   $('sh-notes').hidden=!on;
   $('sh-text').querySelectorAll('.sh-note-mark').forEach(x=>x.hidden=!on);
 }
 $('comment-toggle').addEventListener('click',()=>setComments(!showComments));
 $('font-smaller').addEventListener('click',()=>setFont(fontsize-1));
 $('font-larger').addEventListener('click',()=>setFont(fontsize+1));
 function setFont(n){
   fontsize=Math.max(15,Math.min(24,n));$('sh-text').style.setProperty('--reading-font',fontsize+'px');
   try{localStorage.setItem('shuihu-font-size',String(fontsize))}catch(_){}
 }
 async function load(){
   const q=new URLSearchParams({action:'parse',page:pageTitle,prop:'text',format:'json',formatversion:'2',origin:'*'});
   const request='https://zh.wikisource.org/w/api.php?'+q.toString();
   const target=$('sh-text');
   try{
     const response=await fetch(request,{mode:'cors'});
     if(!response.ok)throw new Error('HTTP '+response.status);
     const data=await response.json();
     if(data.error)throw new Error(data.error.info||'原文接口不可用');
     const raw=data.parse && data.parse.text;
     if(typeof raw!=='string')throw new Error('未返回正文文本');
     const doc=new DOMParser().parseFromString(raw,'text/html');
     const root=doc.querySelector('.mw-parser-output')||doc.body;
     const nodes=[...root.querySelectorAll('p,h2,h3')];
     const frag=document.createDocumentFragment();
     annotations=[];
     let count=0;
     nodes.forEach(node=>{
       if(node.closest('table,nav,header,footer,.mw-collapsible,.noprint,.printfooter,.mw-references-wrap'))return;
       const str=(node.textContent||'').trim().replace(/\u200b/g,'');
       if(!str||str.length<10||/^（?本页|^此作品|^返回目录/.test(str))return;
       if(node.matches('h2,h3')){
         const h=document.createElement('h2');h.textContent=str;frag.appendChild(h);return;
       }
       const p=makeParagraph(str,count);if(p.textContent.trim()||p.querySelector('button')){frag.appendChild(p);count++}
     });
     if(count<3)throw new Error('原文格式与预期不符');
     target.replaceChildren(frag);
     renderNotes();
     setComments(true);
     target.setAttribute('aria-busy','false');
   }catch(err){
     target.setAttribute('aria-busy','false');
     target.replaceChildren();
     const div=document.createElement('div');div.className='sh-reader-error';
     const p=document.createElement('p');p.textContent='站内暂时未能读取维基文库原文（'+String(err.message||err)+'）。你仍可以通过下方链接阅读同一章节。';
     const link=document.createElement('a');link.href=source;link.target='_blank';link.rel='noopener noreferrer';link.textContent='打开这一回的原始全文 →';
     div.append(p,link);target.appendChild(div);
     $('sh-note-list').textContent='原文加载失败，批语暂不可用。';
   }
 }
 load();
})();
</script>
</body></html>
