name: 清理水浒传正文中的来源页尾
on:
  push:
    branches: [main]
    paths:
      - 'tools/clean_shuihu_text.py'
      - '.github/workflows/shuihu-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 清除三种版本正文末尾的维基文库版权模板
        run: python tools/clean_shuihu_text.py
      - name: 提交清理后的正文
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shuihu/text shuihu/100/text shuihu/120/text
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Remove Wikisource license template paragraphs from novel text"
          for retry in 1 2 3 4; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep 3
          done
          exit 1
