name: 构建水浒传百回本与百二十回本
on:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_shuihu_more.py'
      - '.github/workflows/shuihu-more.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edition:
    name: 构建 ${{ matrix.edition }} 回简体正文
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: ['100', '120']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装提取与繁简转换工具
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 opencc-python-reimplemented
      - name: 先完成前几回与目录
        run: python tools/fetch_shuihu_more.py --edition ${{ matrix.edition }} --limit 4
      - name: 提交已完成章节
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shuihu/${{ matrix.edition }}
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add opening chapters of Water Margin ${{ matrix.edition }} edition"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
      - name: 补全本版尚未下载的章节
        run: python tools/fetch_shuihu_more.py --edition ${{ matrix.edition }}
      - name: 提交剩余章节
        run: |
          git add shuihu/${{ matrix.edition }}
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add remaining Water Margin ${{ matrix.edition }} edition chapters"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
