name: 生成网页

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'tools/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行 build.py
        run: python3 tools/build.py
      - name: 提交生成的网页
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html method.html v1
          if git diff --cached --quiet; then
            echo "网页没有变化"
          else
            git commit -m "自动生成网页"
            git push
          fi
