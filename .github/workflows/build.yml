name: 生成网页

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '!content/notes/**'
      - 'assets/**'
      - 'tools/build.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行 build.py
        run: python3 tools/build.py
      - name: 提交生成的网页
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html maoxuan.html method.html v1 v2 v3 v4 v5 text/index.html
          if git diff --cached --quiet; then
            echo "网页没有变化"
          else
            git commit -m "自动生成网页"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
