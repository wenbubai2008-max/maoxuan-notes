<script>
(function(){
 "use strict";
 const entries=window.SHUIHU_CHAPTERS||[];
 const list=document.getElementById("chapter-list");
 function draw(){
   const frag=document.createDocumentFragment();
   entries.forEach(c=>{
     const li=document.createElement("li");
     const a=document.createElement("a");
     a.href="shuihu-read.html?chapter="+c.number;
     const no=document.createElement("span");no.className="jin-num";no.textContent=c.label;
     const title=document.createElement("span");title.className="jin-chapter-name";title.textContent=c.title;
     a.append(no,title);li.appendChild(a);frag.appendChild(li);
   });
   list.replaceChildren(frag);
 }
 draw();
})();
